apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../../recipes/modelserver/base/single-host/default

namePrefix: xpu-vllm-

components:
  - ../../../../../recipes/modelserver/components/images/xpu-vllm

# The published `ghcr.io/llm-d/llm-d-xpu` image (pinned by the component above)
# does not yet support the vLLM `OffloadingConnector` on Intel XPU. Until a
# released image includes it, build the vLLM XPU image locally and override the
# reference here (replace `newName`/`newTag` with your local image and tag).
images:
  - name: ghcr.io/llm-d/llm-d-xpu
    newName: vllm-xpu-env
    newTag: latest

labels:
  - pairs:
      llm-d.ai/model: Qwen3-8B
      llm-d.ai/guide: tiered-prefix-cache
      llm-d.ai/accelerator-variant: xpu
      llm-d.ai/accelerator-vendor: intel
    includeSelectors: true
    includeTemplates: true
patches:
  - path: patch-vllm.yaml
